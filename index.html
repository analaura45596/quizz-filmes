<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Disney Diva Quiz ✨</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #1d032b 0%, #4a0e4e 50%, #0c0014 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .quiz-card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 24px;
      padding: 32px;
      max-width: 550px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 30px rgba(236, 72, 153, 0.3);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .title {
      font-size: 2rem;
      font-weight: 800;
      background: linear-gradient(90deg, #ff7eb3, #ff758c, #f72585);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 0.95rem;
      color: #d8b4fe;
      margin-bottom: 24px;
    }

    .progress-bar {
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      margin-bottom: 24px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #f72585, #7209b7);
      transition: width 0.4s ease;
    }

    .question {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 20px;
      color: #ffffff;
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn-option {
      background: rgba(255, 255, 255, 0.05);
      border: 1.5px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 14px 20px;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: left;
    }

    .btn-option:hover {
      background: rgba(247, 37, 133, 0.2);
      border-color: #f72585;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(247, 37, 133, 0.3);
    }

    .btn-next {
      margin-top: 24px;
      background: linear-gradient(90deg, #f72585, #7209b7);
      color: white;
      border: none;
      padding: 14px 32px;
      border-radius: 50px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(247, 37, 133, 0.4);
      transition: all 0.3s ease;
      display: none;
      width: 100%;
    }

    .btn-next:hover {
      transform: scale(1.02);
      box-shadow: 0 12px 25px rgba(247, 37, 133, 0.6);
    }

    .result-screen {
      display: none;
    }

    .result-title {
      font-size: 1.8rem;
      color: #ff7eb3;
      margin-bottom: 12px;
    }

    .score {
      font-size: 3rem;
      font-weight: 900;
      color: #fff;
      margin-bottom: 12px;
      text-shadow: 0 0 20px #f72585;
    }

    .feedback {
      font-size: 1.1rem;
      color: #e2e8f0;
      margin-bottom: 24px;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="quiz-card">
    <!-- Quiz Screen -->
    <div id="quiz-screen">
      <h1 class="title">Disney Diva Quiz ✨</h1>
      <p class="subtitle">Descubra se você é realmente a maior conhecedora do reino!</p>
      
      <div class="progress-bar">
        <div class="progress-fill" id="progress"></div>
      </div>

      <div class="question" id="question">Carregando pergunta...</div>

      <div class="options" id="options"></div>

      <button class="btn-next" id="next-btn" onclick="nextQuestion()">Próxima Pergunta ✨</button>
    </div>

    <!-- Result Screen -->
    <div id="result-screen" class="result-screen">
      <h1 class="title">Resultado Final 👑</h1>
      <div class="result-title" id="result-title">Sua pontuação:</div>
      <div class="score" id="score">0/5</div>
      <p class="feedback" id="feedback"></p>
      <button class="btn-next" style="display: block;" onclick="restartQuiz()">Jogar De Novo 💋</button>
    </div>
  </div>

  <script>
    const quizData = [
      {
        question: "Qual vilã da Disney tem como maior lema a perfeição da moda e casacos de pele?",
        options: ["Malévola", "Cruella de Vil", "Ursula", "Mamãe Gothel"],
        correct: 1
      },
      {
        question: "Em 'A Nova Onda do Imperador', qual é o nome da vilã mais extravagante e fabulosa?",
        options: ["Yzma", "Helga Sinclair", "Madame Medusa", "Drizella"],
        correct: 0
      },
      {
        question: "Qual destas princesas se veste de homem para salvar o pai e o império inteiro?",
        options: ["Bela", "Mulan", "Tiana", "Merida"],
        correct: 1
      },
      {
        question: "Qual é o nome do icônico dragão minúsculo, mas cheio de atitude, da Mulan?",
        options: ["Pascal", "Mushu", "Meeko", "Cri-Kee"],
        correct: 1
      },
      {
        question: "Qual princesa Disney serviu o look mais icônico em um vestido amarelo dos sonhos?",
        options: ["Cinderela", "Ariel", "Bela", "Aurora"],
        correct: 2
      }
    ];

    let currentQuestion = 0;
    let score = 0;
    let selectedOption = null;

    const questionEl = document.getElementById("question");
    const optionsEl = document.getElementById("options");
    const nextBtn = document.getElementById("next-btn");
    const progressEl = document.getElementById("progress");

    function loadQuestion() {
      selectedOption = null;
      nextBtn.style.display = "none";
      
      const data = quizData[currentQuestion];
      questionEl.textContent = data.question;
      optionsEl.innerHTML = "";

      progressEl.style.width = `${(currentQuestion / quizData.length) * 100}%`;

      data.options.forEach((option, index) => {
        const button = document.createElement("button");
        button.classList.add("btn-option");
        button.textContent = option;
        button.onclick = () => selectOption(index, button);
        optionsEl.appendChild(button);
      });
    }

    function selectOption(index, button) {
      const allButtons = document.querySelectorAll(".btn-option");
      allButtons.forEach(btn => {
        btn.style.background = "rgba(255, 255, 255, 0.05)";
        btn.style.borderColor = "rgba(255, 255, 255, 0.15)";
      });

      selectedOption = index;
      button.style.background = "rgba(247, 37, 133, 0.3)";
      button.style.borderColor = "#f72585";
      nextBtn.style.display = "block";
    }

    function nextQuestion() {
      if (selectedOption === quizData[currentQuestion].correct) {
        score++;
      }

      currentQuestion++;

      if (currentQuestion < quizData.length) {
        loadQuestion();
      } else {
        showResults();
      }
    }

    function showResults() {
      document.getElementById("quiz-screen").style.display = "none";
      document.getElementById("result-screen").style.display = "block";
      document.getElementById("score").textContent = `${score}/${quizData.length}`;

      const feedbackEl = document.getElementById("feedback");
      if (score === quizData.length) {
        feedbackEl.innerHTML = "👑 **SURREAL DE DIVA!** Você domina o reino da Disney de olhos fechados. Uma verdadeira rainha do topo!";
      } else if (score >= 3) {
        feedbackEl.innerHTML = "✨ **MUITO FABULOSA!** Você sabe quase tudo sobre o universo Disney. Só falta um tiquinho para a coroa de ouro!";
      } else {
        feedbackEl.innerHTML = "💅 **UM DESAFIINHO, FOFA!** Precisa fazer uma maratona Disney de fim de semana para renovar suas energias de princesa!";
      }
    }

    function restartQuiz() {
      currentQuestion = 0;
      score = 0;
      document.getElementById("quiz-screen").style.display = "block";
      document.getElementById("result-screen").style.display = "none";
      loadQuestion();
    }

    loadQuestion();
  </script>
</body>
</html>
